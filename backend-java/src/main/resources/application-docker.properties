# ============================================
# TravelVista — Docker / Cloud Profile
# Deploy: Render, Railway, Docker
# Database: Neon (cloud PostgreSQL)
# ============================================

# ─── Server ───
server.port=${PORT:8080}
server.address=0.0.0.0

# ─── Database (Neon) ───
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:2324}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP (Neon has connection limits) ───
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ─── JPA ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ─── JWT ───
jwt.secret=${JWT_SECRET:TravelVistaSecretKeyForJWTTokenGenerationMustBeAtLeast256BitsLong!!2024}
jwt.expiration=28800000

# ─── File Upload ───
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ─── CORS ───
app.cors.allowed-origins=${CORS_ORIGINS:*}

# ─── Cloudinary ───
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:Maqlaim_Travel}
cloudinary.api_key=${CLOUDINARY_API_KEY:273799397565824}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:RLpt4mQLQekBLlopxeZovC-7co0}

# ─── Email (SMTP) ───
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:dhaval.maqlaim@gmail.com}
spring.mail.password=${MAIL_PASSWORD:rart vxli rtjv slgq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
